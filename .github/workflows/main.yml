
name: Build PyroRealism

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Find source ZIP
        id: source
        shell: bash
        run: |
          ZIP_FILE="PyroRealism-NeoForge-1.21.1-Source-FIXED3.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP not found: $ZIP_FILE"
            echo "Upload the source ZIP to the repository root."
            exit 1
          fi

          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract source ZIP
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.source.outputs.zip }}" -d extracted

          PROJECT_DIR="$(find extracted -type f -name build.gradle \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::build.gradle not found in ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"

      - name: Compile mod
        run: gradle -p "$PROJECT_DIR" build --no-daemon --stacktrace

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: PyroRealism-NeoForge-1.21.1
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
